# Unicorn equivalence checker regression corpus.
#
# Each entry has (symbol, unit, expected_verdict, expected_class, source).
# The corpus_check.py harness re-runs the unicorn comparator against each
# entry and reports deltas. New corpus entries should be hand-verified —
# the goal is a small, high-trust regression suite.
#
# expected_verdict: EQUIVALENT | DIVERGENT
# expected_class:   the divergence class, or null for EQUIVALENT
# source:           free-form provenance note (which experiment found this)
#
# Sections:
#   known_tps    — confirmed behaviorally-equivalent functions. New signal
#                  layers MUST NOT flip these to DIVERGENT.
#   known_divergent — confirmed-different functions, with the class that the
#                  current signal model assigns. Useful for catching class
#                  reclassification regressions (e.g. v15 should not
#                  suddenly call a call_count func a build_env).
#   known_fps    — confirmed false positives we want to FIX. Empty at
#                  signal v1 because Phase 0 found 0 flips. Will populate
#                  when Phase 3 (unmapped fingerprint) or Phase 6
#                  (sentinel object memory) surfaces new FPs.
#
# Seeded 2026-05-14 from cl_temp_files/phase0/ outputs.

