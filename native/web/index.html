<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: in landscape the picture may use the whole screen
         (the CSS keeps it inside the safe-area insets: notch, home bar).
         Phones: docs/native/WEB.md "Phones: iPhone and iPad" (PLAN W-31). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Dance Central 3</title>
    <!-- ?gpu_profile=mobile|bare|record: mask the WebGPU adapter like an
         iPhone's and record what the engine asks for (PLAN W-29). Does
         nothing without the parameter. -->
    <script src="gpu_profile.js"></script>
    <style>
        /* Two layouts (W-8). Default: the player page -- the game canvas fills
           the window at 16:9, the pose panel sits on it (pose/pose_input.js),
           and a loading/error card shows until the first screen. ?dev (or
           ?debug=true) adds the developer harness: status bar, key help,
           pause/step and the engine console, under an 80vh canvas. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* No rubber-band scroll, pull-to-refresh or double-tap zoom on a phone
           (W-31): the page never scrolls in the player layout. */
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ccc;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: relative;
            /* Largest 16:9 box that fits the visible window inside the
               safe-area insets. 100dvh, not 100vh: on iOS 100vh includes the
               area under Safari's toolbars, so a 100vh box overflows the
               screen; the env() insets are 0 everywhere but a notched phone
               (viewport-fit=cover). */
            --safe-w: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            --safe-h: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            width: min(var(--safe-w), calc(var(--safe-h) * 16 / 9));
            height: min(var(--safe-h), calc(var(--safe-w) * 9 / 16));
        }
        @supports (height: 100dvh) {
            #canvas-container {
                --safe-h: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            }
        }
        #dc3-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        /* Fullscreen makes the container the whole screen, which need not be
           16:9 (a 16:10 laptop): letterbox the 16:9 buffer instead of
           stretching it. */
        #canvas-container:fullscreen { background: #000; }
        #canvas-container:fullscreen #dc3-canvas { object-fit: contain; }
        /* Portrait (portrait.js sets html.dc3-portrait on a phone held
           upright; ?portrait=0 keeps the old centred picture). The 16:9
           picture fills the width at the top -- the same size as before, it
           is width-bound either way -- and the deck under it holds what is
           on screen, the camera view and the button cluster. */
        #dc3-deck { display: none; }
        html.dc3-portrait {
            --pic-h: calc((100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) * 9 / 16);
            --deck-h: calc(100vh - var(--pic-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            /* one touch button's size (touch_controls.js): a quarter of the
               width, less when the deck is short, never under 48 px (so the
               d-pad's 0.92 is 44 px; B and Start are floored at 44 px). This
               is the fallback: portrait.js measures the deck and sets --tb,
               --panel-top and --view-h inline (layoutDeck). */
            --tb: min(24vw, 112px, max(48px, calc((var(--deck-h) - 250px) / 3.2)));
        }
        @supports (height: 100dvh) {
            html.dc3-portrait { --deck-h: calc(100dvh - var(--pic-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
        }
        html.dc3-portrait:not(.dev) body { justify-content: flex-start; }
        html.dc3-portrait:not(.dev) #canvas-container { margin-top: env(safe-area-inset-top, 0px); }
        html.dc3-portrait:not(.dev) #dc3-deck {
            display: flex; flex-direction: column; align-items: stretch;
            position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
            top: calc(env(safe-area-inset-top, 0px) + var(--pic-h));
            padding: 12px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
            pointer-events: none;
            background: radial-gradient(120% 70% at 50% 100%, #2a0838 0%, #0b0610 55%, #000 100%);
        }
        #dc3-deck .now {
            border-radius: 14px; padding: 10px 14px 11px;
            background: linear-gradient(135deg, #c0f3, #40c3 60%, #0000);
            border: 1px solid #c0f6; box-shadow: 0 4px 18px #c0f2;
        }
        #dc3-deck .label { font: 700 11px/1.2 system-ui, sans-serif; letter-spacing: 0.14em; color: #e9f; text-transform: uppercase; }
        #dc3-deck .screen { font: 700 22px/1.25 system-ui, sans-serif; color: #fff; margin-top: 2px; }
        #dc3-deck .song { font: 500 16px/1.3 system-ui, sans-serif; color: #fcf; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #dc3-deck .tip { font: 12px/1.3 system-ui, sans-serif; color: #998; text-align: center; margin-top: 8px; }
        /* The camera view under the "now" card, at a size a player standing
           back can read (in the 16:9 strip it was about 23 px tall). */
        html.dc3-portrait:not(.dev) #pose-panel {
            position: fixed; z-index: 16; bottom: auto; left: 50%; transform: translateX(-50%);
            top: var(--panel-top, calc(env(safe-area-inset-top, 0px) + var(--pic-h) + 140px));
            width: max-content; max-width: 92vw; gap: 10px; font-size: 13px; align-items: center;
        }
        html.dc3-portrait:not(.dev) #pose-view { height: var(--view-h, min(26vw, calc(var(--deck-h) - 156px - 3.4 * var(--tb)))); min-height: 40px; border-radius: 10px; }
        html.dc3-portrait:not(.dev) #pose-status { max-width: 56vw; }
        /* A short deck (a split screen, a near-square foldable; portrait.js
           decides): the button cluster at the right, the now card and the
           camera view in the column left of it, no tip. */
        html.dc3-portrait.dc3-portrait-compact:not(.dev) #dc3-deck .tip { display: none; }
        html.dc3-portrait.dc3-portrait-compact:not(.dev) #dc3-deck .now { margin-right: calc(var(--tb) * 3 + 12px); }
        html.dc3-portrait.dc3-portrait-compact:not(.dev) #pose-panel {
            left: max(14px, env(safe-area-inset-left, 0px)); transform: none; max-width: var(--col-w, 52vw);
        }
        html.dc3-portrait.dc3-portrait-compact:not(.dev) #pose-status { max-width: none; min-width: 0; font-size: 11px; }
        /* A long screen name stops at three lines (two, smaller, in the
           compact column), so it cannot push the camera view off the screen. */
        html.dc3-portrait:not(.dev) #dc3-deck .screen {
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
        }
        html.dc3-portrait.dc3-portrait-compact:not(.dev) #dc3-deck .screen { font-size: 18px; -webkit-line-clamp: 2; }
        /* The full-screen button (touch_controls.js): the corner of the now
           card in portrait; the card leaves it room. */
        html.dc3-portrait:not(.dev) #dc3-deck .now { padding-right: 58px; position: relative; }
        /* A song held upright (portrait.js, html.dc3-portrait-song; the
           engine draws a 9:16 frame then): the picture is 9:16, full width
           at the top, unless the screen is too short for that and a strip;
           under it a slim strip with the camera view (left) and B and Start
           (right). The deck's "now" card and the d-pad give way. */
        html.dc3-portrait.dc3-portrait-song {
            --strip: 92px;
            --song-w: min(calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
                          calc((100vh - var(--strip) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
            --pic-h: calc(var(--song-w) * 16 / 9);
            --tb: 60px;
        }
        @supports (height: 100dvh) {
            html.dc3-portrait.dc3-portrait-song {
                --song-w: min(calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)),
                              calc((100dvh - var(--strip) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
            }
        }
        html.dc3-portrait.dc3-portrait-song:not(.dev) #canvas-container { width: var(--song-w); height: var(--pic-h); }
        html.dc3-portrait.dc3-portrait-song:not(.dev) #dc3-deck .now,
        html.dc3-portrait.dc3-portrait-song:not(.dev) #dc3-deck .tip { display: none; }
        html.dc3-portrait.dc3-portrait-song:not(.dev) #pose-panel {
            top: calc(env(safe-area-inset-top, 0px) + var(--pic-h) + 8px); left: max(10px, env(safe-area-inset-left, 0px));
            transform: none; max-width: 52vw; gap: 6px; font-size: 11px;
        }
        html.dc3-portrait.dc3-portrait-song:not(.dev) #pose-view { height: calc(var(--strip) - 22px); min-height: 40px; }
        html.dc3-portrait.dc3-portrait-song:not(.dev) #pose-status { display: none; }
        #loading {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #000;
            color: #aaa;
            font-size: 16px;
            text-align: center;
            padding: 24px;
            transition: opacity 0.4s ease-out;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .spinner {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid #333; border-top-color: #c0f;
            animation: dc3spin 0.9s linear infinite;
        }
        #loading.error { color: #f99; }
        #loading.error .spinner { display: none; }
        /* A refused or failed boot owns the whole screen (W-31): on a phone in
           portrait the 16:9 box is a strip, and the message overflowed it
           under the touch buttons and the camera panel. Those are not shown
           (touch_controls.js / pose_input.js check window.dc3BootBlocked)
           or are hidden here if the failure came later. */
        html:not(.dev) #loading.error {
            position: fixed; inset: 0; z-index: 40;
            padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px))
                     max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
        }
        html.dc3-failed #dc3-touch, html.dc3-failed #pose-panel, html.dc3-failed #dc3-sound { display: none !important; }
        #dc3-sound {
            position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
            top: max(10px, env(safe-area-inset-top, 0px)); display: none;
            background: #000c; color: #fff; border: 1px solid #c0f; border-radius: 18px;
            padding: 8px 16px; font: 600 15px/1.2 system-ui, sans-serif; cursor: pointer;
        }
        #loading-text { max-width: 760px; line-height: 1.5; }
        #loading-text code { color: #fc6; }
        @keyframes dc3spin { to { transform: rotate(360deg); } }
        .dev-only { display: none; }

        /* ---- developer harness (?dev / ?debug=true) ---- */
        html.dev body { background: #0a0a0a; overflow: auto; }
        html.dev #canvas-container {
            /* Height-first: fill 80% of viewport height, derive width from 16:9 */
            height: 80vh;
            width: min(100vw, calc(80vh * 16 / 9));
            max-width: 100vw;
        }
        html.dev #dc3-canvas { outline: 1px solid #333; }
        html.dev .dev-only { display: block; }
        html.dev #toolbar.dev-only { display: flex; }
        html.dev #loading { display: none; }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }
        #status.error { color: #e55; }
        #status.ok { color: #5e5; }
        #status.loading { color: #5ae; }
        #controls {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #controls span {
            color: #888;
            background: #1a1a1a;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        #toolbar {
            margin-top: 8px;
            gap: 8px;
        }
        #toolbar button {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 14px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        #toolbar button:hover { background: #2a2a2a; border-color: #555; }
        #toolbar button.active { color: #f90; border-color: #f90; }
        #console {
            margin-top: 8px;
            max-width: 1280px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        #console .err { color: #c66; }
    </style>
    <script>
        // ?dev (any value but 0/false/off) or ?debug=true -> developer harness.
        (function() {
            var q = new URLSearchParams(location.search);
            function on(v) { return v !== null && v !== '0' && v !== 'false' && v !== 'off'; }
            window.dc3DevPage = on(q.get('dev')) || (on(q.get('debug')) && q.get('dev') === null);
            if (window.dc3DevPage) document.documentElement.classList.add('dev');
            // The one touch test the page uses (portrait.js, touch_controls.js
            // and the sound button read it): the PRIMARY pointer is a finger.
            // "(any-pointer: fine)" false was the old test, and a phone with a
            // stylus or a Bluetooth mouse paired has a fine pointer too, so it
            // lost its buttons; a touch laptop's primary pointer stays fine.
            window.dc3TouchOnly = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            // ?portrait= / ?touch= / ?dev= share one reading of a switch.
            window.dc3Switch = function(v) {
                if (v === null || v === undefined) return null;
                v = String(v).toLowerCase();
                if (v === '0' || v === 'false' || v === 'off' || v === 'no') return false;
                if (v === '1' || v === 'true' || v === 'on' || v === 'yes' || v === '') return true;
                return null;
            };
        })();
    </script>
    <script>
        // Sound on a phone (W-31). iOS (and Chrome's autoplay policy) start an
        // AudioContext suspended until a user gesture, and on iOS only the END
        // of a touch (touchend / pointerup / click) counts as one -- the
        // engine's own resume listeners are keydown/click/touchstart, and the
        // on-screen buttons' keys are synthetic (no gesture at all). A camera
        // player may never touch the screen. So: every AudioContext the page
        // makes is tracked, any gesture resumes the suspended ones (iOS also
        // has "interrupted", after a call or Siri), and on a touch-only device
        // a "Tap for sound" button shows while one is still not running.
        (function() {
            var Orig = window.AudioContext || window.webkitAudioContext;
            if (!Orig) return;
            var ctxs = window.dc3AudioContexts = [];
            var Tracked = class extends Orig {
                constructor(opts) { super(opts); ctxs.push(this); }
            };
            window.AudioContext = Tracked;
            if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
            function silent() {
                return ctxs.filter(function(c) { return c.state !== 'running' && c.state !== 'closed'; });
            }
            function unlock() {
                silent().forEach(function(c) { c.resume().catch(function() {}); });
                setTimeout(update, 250);
            }
            ['pointerup', 'touchend', 'click', 'keydown'].forEach(function(t) {
                document.addEventListener(t, unlock, { capture: true, passive: true });
            });
            var q = new URLSearchParams(location.search).get('sound_button');
            var touchOnly = window.dc3TouchOnly;
            var useButton = q === '1' || (q !== '0' && touchOnly);
            var btn = null;
            function update() {
                if (!btn) return;
                var loadingEl = document.getElementById('loading');
                var running = !loadingEl || loadingEl.classList.contains('hidden');
                btn.style.display = (running && silent().length) ? 'block' : 'none';
            }
            window.dc3SoundState = function() {
                return { contexts: ctxs.map(function(c) { return c.state; }),
                         button: !!btn && btn.style.display === 'block' };
            };
            if (!useButton) return;
            document.addEventListener('DOMContentLoaded', function() {
                btn = document.createElement('button');
                btn.id = 'dc3-sound';
                btn.type = 'button';
                btn.textContent = 'Tap for sound';
                btn.addEventListener('click', unlock);
                document.body.appendChild(btn);
                setInterval(update, 1000);
            });
        })();
    </script>
    <script>
        // Path-prefix shim (2026-07-31): lets this exact build be served
        // unmodified either at the server root (localhost:8420, the app
        // server's native home) OR behind a reverse proxy mounted at a
        // sub-path (e.g. https://home.freeqaz.com/dc3/). Ported from rb3's
        // native/web/index.html, which hit this first at /rb3/.
        //
        // The game constructs root-absolute "/api/..." URLs in places we
        // don't want to touch (the splash <video> src, the /api/version
        // cache-bust probe, and WebAssets' emscripten_fetch/sync XHR) —
        // under a prefix those resolve to the proxy's ROOT and 404. Instead
        // we derive the mount base from the page's own URL and prefix just
        // the "/api/" calls at the fetch/XHR/beacon/media-src layer, before
        // any of that code runs. Everything else on the page (release/ and
        // debug/ wasm, the audio worklet) already uses paths relative to
        // index.html, so it needs no help.
        //
        // base is "" at the server root (index.html or /), so the whole
        // block is a no-op there — zero behavior change on localhost:8420.
        var base = location.pathname.replace(/\/(index\.html)?$/, '');
        if (base) {
            window.__dc3UrlBase = base;

            // Only touch our own root-absolute API surface; anything else
            // (relative build assets, third-party URLs, non-string args)
            // passes through untouched.
            function dc3PrefixApi(url) {
                if (typeof url === 'string' && url.indexOf('/api/') === 0) {
                    return base + url;
                }
                return url;
            }

            var dc3Fetch = window.fetch;
            window.fetch = function(input, init) {
                return dc3Fetch.call(this, dc3PrefixApi(input), init);
            };

            var dc3XhrOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                var args = Array.prototype.slice.call(arguments);
                args[1] = dc3PrefixApi(url);
                return dc3XhrOpen.apply(this, args);
            };

            if (navigator.sendBeacon) {
                var dc3SendBeacon = navigator.sendBeacon;
                navigator.sendBeacon = function(url, data) {
                    return dc3SendBeacon.call(navigator, dc3PrefixApi(url), data);
                };
            }

            // The splash overlay assigns "/api/file/ui/splash/flimflam.webm"
            // straight to a <video>'s .src — a DOM property write, not a
            // fetch/XHR/beacon call, so it slips past the three patches
            // above. Patch the shared HTMLMediaElement.src setter (covers
            // <video> and <audio>) the same way.
            var dc3MediaSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
            if (dc3MediaSrcDesc && dc3MediaSrcDesc.set) {
                Object.defineProperty(HTMLMediaElement.prototype, 'src', {
                    get: dc3MediaSrcDesc.get,
                    set: function(url) {
                        dc3MediaSrcDesc.set.call(this, dc3PrefixApi(url));
                    },
                    configurable: true
                });
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="dc3-canvas" width="1280" height="720" tabindex="0"></canvas>
        <video id="splash-video" playsinline muted preload="auto"
               style="position:absolute;top:0;left:0;width:100%;height:100%;
                      object-fit:contain;z-index:2147483647;background:#000;
                      pointer-events:none;transform:translateZ(0);"></video>
        <div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>
    </div>
    <div id="status" class="dev-only">Initializing...</div>
    <div id="controls" class="dev-only">
        <span>Arrows/WASD</span> navigate &nbsp;
        <span>Enter</span> confirm &nbsp;
        <span>Esc</span> back &nbsp;
        <span>Space</span> start &nbsp;
        <span>Tab</span> select &nbsp;
        <span>Q/E</span> LB/RB &nbsp;
        <span>Gamepad</span> auto-detected
    </div>
    <div id="toolbar" class="dev-only">
        <button id="btn-pause" title="Pause/resume engine loop (P)">Pause</button>
        <button id="btn-step" title="Advance one frame while paused (.)">Step</button>
    </div>
    <div id="console" class="dev-only"></div>

    <script>
        const status = document.getElementById('status');
        const logDiv = document.getElementById('console');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const DEV = window.dc3DevPage;

        // Dev console only, capped: the engine prints thousands of lines a song.
        const CONSOLE_MAX_LINES = 500;
        function log(text, isErr) {
            if (!DEV) return;
            const line = document.createElement('div');
            line.textContent = text;
            if (isErr) line.className = 'err';
            logDiv.appendChild(line);
            while (logDiv.childElementCount > CONSOLE_MAX_LINES) logDiv.firstChild.remove();
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // One status for both layouts: the dev status bar, and the player's
        // loading card (hidden once the first screen is entered; an error stays).
        function setStatus(html, cls) {
            status.innerHTML = html;
            status.className = 'dev-only ' + (cls || '');
            loadingText.innerHTML = html;
            if (cls === 'error') {
                loading.classList.add('error');
                loading.classList.remove('hidden');
                var sv = document.getElementById('splash-video');
                if (sv) sv.remove();  // it sits above everything
                // The error card owns the screen: no touch buttons, no camera
                // panel over it, and the camera is let go (W-31).
                document.documentElement.classList.add('dc3-failed');
                if (typeof window.dc3PoseShutdown === 'function') window.dc3PoseShutdown();
            }
        }
        // The page will not boot the engine here. Everything that would start
        // alongside it (the camera, the touch buttons: separate scripts that
        // still run after this one throws) checks window.dc3BootBlocked.
        function refuseBoot(reason, html, logLine) {
            window.dc3BootBlocked = reason;
            setStatus(html, 'error');
            status.style.maxWidth = '900px';
            status.style.textAlign = 'center';
            log(logLine, true);
            throw new Error(reason);
        }
        // Apple's mobile devices: every iOS/iPadOS browser is WebKit, so a
        // missing feature there is fixed by updating iOS, never by another
        // browser. iPadOS Safari reports a Mac user agent; touch tells it apart.
        const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                       (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        const IS_MAC_SAFARI = !IS_IOS && /Macintosh/.test(navigator.userAgent) &&
                              /Safari\//.test(navigator.userAgent) && !/Chrom(e|ium)|Edg\/|Firefox/.test(navigator.userAgent);
        // What this Safari says it is. On iPhone and iPad the OS token in the
        // user agent is frozen at "18_7" from iOS 26 on, so the Version/ token
        // is the only one that tells iOS 26 from iOS 27, and Safari's version is
        // the iOS version. Other iOS browsers (CriOS, FxiOS) carry no Version/
        // token: null, and the card then says nothing about the version.
        const SAFARI_VERSION = (function () {
            const m = /Version\/(\d+(?:\.\d+)*)/.exec(navigator.userAgent);
            return m && /Safari\//.test(navigator.userAgent) && !/Chrom(e|ium)|Edg\//.test(navigator.userAgent) ? m[1] : null;
        })();
        const SAFARI_MAJOR = SAFARI_VERSION ? parseInt(SAFARI_VERSION, 10) : 0;
        // The iOS advice for a missing feature that Safari 27 has. A phone that
        // already reports 27 must not be told to update to 27.
        function iosAdvice() {
            const has = SAFARI_VERSION
                ? 'This device reports iOS ' + SAFARI_VERSION + ' (Safari ' + SAFARI_VERSION + '). '
                : '';
            if (SAFARI_MAJOR >= 27) {
                return has + 'That version should be able to run the game, so this is a fault in the page or a ' +
                    'restriction on the device (Lockdown Mode, for example).';
            }
            return has + 'The game needs iOS 27 (Safari 27) or newer: Settings › General › Software Update. ' +
                'An iOS 26 update there is not enough; iOS 27 can be listed separately, lower on that screen, as ' +
                '“Upgrade to iOS 27”. Every iPhone browser uses Safari\'s engine, so Chrome or Firefox on the phone will not help.';
        }
        window.dc3SafariVersion = SAFARI_VERSION;  // scripts/web/phone.mjs reads it
        // Console level for one engine stderr line: 'error' | 'warn' | 'log'.
        // "timer error is large" is the image's song-clock diagnostic
        // (StandardStream::UpdateTime, a MILO_LOG), a warning, not a failure.
        const DC3_STDERR_ERROR = /^(FAIL|MILO_FAIL|MILO_ASSERT|Assertion|Aborted|RuntimeError|ERROR|FATAL)\b|\b(error|errors|failed|failure|fatal|exception|abort(ed)?|crash(ed)?)\b/i;
        const DC3_STDERR_WARN = /^(MILO_WARN|WARN|WARNING)\b|\bwarn(ing)?\b|^timer error is large/i;
        function dc3StderrLevel(text) {
            if (DC3_STDERR_WARN.test(text)) return 'warn';
            if (DC3_STDERR_ERROR.test(text)) return 'error';
            return 'log';
        }
        window.dc3StderrLevel = dc3StderrLevel;  // scripts/web/page-states.mjs checks it

        function gameRunning() {
            if (loading.classList.contains('error')) return;
            loading.classList.add('hidden');
        }

        // WebGPU, the camera and the audio worklet's SharedArrayBuffer all need a
        // secure context (https, or http://localhost). Over plain http from
        // another machine (a phone on the LAN, a bare Tailscale IP) the browser
        // hides navigator.gpu, and the generic "no WebGPU" advice below would
        // send the player to browser flags that cannot help.
        if (!window.isSecureContext) {
            refuseBoot('insecure context',
                '<strong>This page needs a secure connection.</strong><br>' +
                '<span style="color:#aaa">WebGPU, the camera and game audio only work over ' +
                '<code>https://</code> (or on <code>localhost</code>). Open the https address of ' +
                'this server instead of <code>' + location.origin.replace(/[<>&]/g, '') + '</code>.</span>',
                'not a secure context — refusing to boot engine');
        }
        // Hard stop if WebGPU isn't available — without it the canvas is just
        // black after the splash, and we'd otherwise download 12MB of assets
        // before that's obvious. Show the user how to enable it instead.
        if (!navigator.gpu) {
            const ua = navigator.userAgent;
            const isFirefox = /Firefox/.test(ua);
            const isChromium = /Chrom(e|ium)/.test(ua);
            const isMobile = IS_IOS || /Android|Mobile/.test(ua);
            const browserHelp = isMobile
                ? (IS_IOS
                    // Safari has WebGPU from iOS 26; JSPI arrives with iOS 27.
                    ? iosAdvice()
                    : 'On Android, use Chrome 137 or newer; WebGPU needs Android 12+ and a supported GPU (chrome://gpu shows "WebGPU: Hardware accelerated").')
                : isFirefox
                ? 'Firefox: WebGPU requires Nightly with <code>dom.webgpu.enabled=true</code> in <code>about:config</code>.'
                : IS_MAC_SAFARI
                ? 'On a Mac, use Safari 27 or newer, or Chrome/Edge 137 or newer.'
                : isChromium
                ? 'Chrome/Chromium on Linux: launch with <code>--enable-unsafe-webgpu --enable-features=Vulkan</code>, or toggle <code>chrome://flags/#enable-unsafe-webgpu</code>.'
                : 'Use a Chromium-based browser with WebGPU enabled, or Firefox Nightly with <code>dom.webgpu.enabled</code>.';
            refuseBoot('WebGPU unavailable',
                '<strong>WebGPU not available in this browser.</strong><br>' +
                '<span style="color:#aaa">DC3 needs WebGPU to render. ' + browserHelp + '</span>',
                'WebGPU not available — refusing to boot engine (would render black)');
        }
        // The build also needs JSPI (WebAssembly.Suspending): Chrome/Edge 137+,
        // and Safari 27 (iOS 27 / macOS). Safari 26 has WebGPU and passes the
        // check above but has no JSPI, so without this it fails later inside
        // the WASM instantiate with an error that names neither feature.
        if (typeof WebAssembly === 'undefined' || typeof WebAssembly.Suspending !== 'function') {
            const jspiHelp = IS_IOS
                ? iosAdvice()
                : IS_MAC_SAFARI
                ? 'Safari 26 does not have it; Safari 27 does. Update Safari (macOS Software Update), or use Chrome or Edge 137 or newer.'
                : 'Use Chrome or Edge 137 or newer (Windows, macOS, Linux, Android), or Safari 27 or newer on a Mac.';
            refuseBoot('JSPI unavailable',
                '<strong>This browser lacks WebAssembly JSPI.</strong><br>' +
                '<span style="color:#aaa">DC3 needs WebGPU and WebAssembly JSPI. ' + jspiHelp + '</span>',
                'JSPI (WebAssembly.Suspending) not available' + (SAFARI_VERSION ? ' (Safari ' + SAFARI_VERSION + ')' : '') + ' — refusing to boot engine');
        }
        {
            setStatus('Loading…', 'loading');

            var wasmReady = false;
            var Module = {
                canvas: document.getElementById('dc3-canvas'),
                onRuntimeInitialized: function() {
                    wasmReady = true;
                    console.log('RUNTIME_INIT_OK');
                    setStatus('Downloading game data…', 'loading');
                },
                print: function(text) {
                    console.log(text);
                    log(text);
                    // Update status based on engine output
                    if (text.includes('downloads complete') || text.includes('assets ready')) {
                        setStatus('Starting…', 'loading');
                    }
                    if (text.includes('GPU ready')) {
                        setStatus('Rendering', 'ok');
                    }
                    if (text.includes("will enter '")) {
                        gameRunning();
                        // portrait.js shows the screen in its deck
                        var sm = /will enter '([^']+)'/.exec(text);
                        if (sm) document.dispatchEvent(new CustomEvent('dc3-screen', { detail: { screen: sm[1] } }));
                    }
                    if (text.includes('GPU init failed')) {
                        setStatus('GPU not available (headless mode)', 'error');
                    }
                },
                printErr: function(text) {
                    // The engine writes its diagnostics to stderr (MILO_LOG and
                    // ~700 fprintf(stderr) trace sites), so stderr is mostly
                    // log traffic: only lines that report a failure go to
                    // console.error, warnings to console.warn, the rest to
                    // console.log (W-13; it used to be all console.error).
                    const level = dc3StderrLevel(text);
                    console[level](text);
                    log(text, level === 'error');
                    // Adapter/device failures from the WebGPU layer arrive on stderr.
                    // Surface them in the status bar so the user knows why nothing renders.
                    if (text.includes('adapter request failed') ||
                        text.includes('device request failed') ||
                        text.includes('device lost')) {
                        setStatus(DEV ? 'GPU error — see console'
                                      : 'Graphics error (WebGPU). Reload the page; if it keeps happening, restart the browser.',
                                  'error');
                        var sv = document.getElementById('splash-video');
                        if (sv) sv.remove();
                    }
                }
            };

            // --- Splash video overlay ---
            // Plays flimflam.webm over the canvas while WASM boots.
            // Purely cosmetic — the engine skips its own splash on web.
            var splashVid = document.getElementById('splash-video');
            splashVid.src = '/api/file/ui/splash/flimflam.webm';
            splashVid.play().catch(function() {});
            function dismissSplash() {
                if (!splashVid) return;
                // Detach now: a second dismiss inside the fade (video 'ended'
                // plus a key press) used to find splashVid already nulled by
                // the first timer and throw "reading 'remove'" (a page error).
                var v = splashVid;
                splashVid = null;
                v.style.transition = 'opacity 0.4s ease-out';
                v.style.opacity = '0';
                setTimeout(function() { v.remove(); }, 500);
            }
            splashVid.addEventListener('ended', dismissSplash);
            // The engine takes the video down itself when its boot plan shows
            // no splash (a browser that has played before lands on the title
            // screen; main_web.cpp WebScreenBundleHook, PLAN H-123).
            window.dc3DismissSplash = dismissSplash;
            // Unmute on first interaction (autoplay requires muted)
            function splashUnmute() {
                if (splashVid) splashVid.muted = false;
                document.removeEventListener('keydown', splashUnmute);
                document.removeEventListener('click', splashUnmute);
                document.removeEventListener('touchend', splashUnmute);
            }
            document.addEventListener('keydown', splashUnmute);
            document.addEventListener('click', splashUnmute);
            document.addEventListener('touchend', splashUnmute);
            // Skip on Space/Enter/Escape
            function splashSkip(e) {
                if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter' && e.key !== 'Escape') return;
                dismissSplash();
            }
            document.addEventListener('keydown', splashSkip);
            document.addEventListener('click', splashSkip);
            // Safety: dismiss after 20s even if video stalls
            setTimeout(function() { if (splashVid) dismissSplash(); }, 20000);

            // ── Build selection: release (default, cached) vs debug ──────────
            // build.sh deploys two variants into sibling subdirs:
            //   release/ — debug-info stripped + brotli/gzip, served immutable
            //   debug/   — full -g2 wasm, served no-store (fast iteration)
            // ?debug=true (or ?debug=1) loads debug and bypasses the HTTP cache;
            // anything else loads release. Release URLs are version-stamped with
            // ?v=<token> from /api/version so a rebuilt release wasm busts the
            // immutable cache (the server keys caching off the /release/ path,
            // ignoring the query). Falls back to the other variant if one isn't
            // deployed. No pre-js here, so Module.locateFile is what redirects
            // emscripten's wasm fetch into the chosen subdir.
            var dbgParam = new URLSearchParams(location.search).get('debug');
            var wantDebug = dbgParam !== null &&
                            dbgParam !== '0' && dbgParam !== 'false' && dbgParam !== 'off';

            function loadBuild(dir, version, isFallback) {
                var q = (dir === 'release/' && version) ? ('?v=' + encodeURIComponent(version)) : '';
                var wasmUrl = dir + 'dc3-web.wasm' + q;
                Module.locateFile = function(path) { return dir + path + q; };
                // Explicit streaming instantiation (mirrors RB3's rb3_pre.js) of
                // the version-stamped wasm URL, so a reload of the immutable
                // release build reuses the cached + already-compiled wasm instead
                // of re-downloading it (verified fromDiskCache on reload with a
                // persistent browser profile). Imports pass through unchanged —
                // emscripten's abort-stubs for --allow-undefined imports stay
                // intact (DC3 instantiates fine without patching).
                Module.instantiateWasm = function(imports, successCallback) {
                    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
                    function viaArrayBuffer() {
                        return fetch(wasmUrl)
                            .then(function(r) { return r.arrayBuffer(); })
                            .then(function(bytes) { return WebAssembly.instantiate(bytes, imports); })
                            .then(function(res) { successCallback(res.instance, res.module); });
                    }
                    if (typeof WebAssembly.instantiateStreaming === 'function') {
                        return WebAssembly.instantiateStreaming(fetch(wasmUrl), imports)
                            .then(function(res) {
                                console.log('[dc3] wasm instantiateStreaming ' + ((performance.now() - t0) | 0) + 'ms');
                                successCallback(res.instance, res.module);
                            })
                            .catch(function(err) {
                                console.warn('[dc3] instantiateStreaming failed (' + err + '); arrayBuffer fallback');
                                return viaArrayBuffer();
                            });
                    }
                    return viaArrayBuffer().catch(function(err) { console.error('[dc3] instantiateWasm failed: ' + err); });
                };
                console.log('LOADING_WASM_JS (' + dir + (q || '') + ')');
                var script = document.createElement('script');
                script.src = dir + 'dc3-web.js' + q;
                script.onload = function() { console.log('WASM_JS_LOADED (' + dir + ')'); };
                script.onerror = function(e) {
                    if (!isFallback) {
                        var other = (dir === 'release/') ? 'debug/' : 'release/';
                        console.warn('[dc3] ' + dir + ' build not deployed — falling back to ' + other);
                        loadBuild(other, version, true);
                        return;
                    }
                    console.error('WASM_JS_ERROR: ' + e);
                    setStatus(DEV ? 'No build deployed — run scripts/web/build.sh'
                                  : 'The game could not be loaded from this server.', 'error');
                };
                document.body.appendChild(script);
            }

            var primaryDir = wantDebug ? 'debug/' : 'release/';
            if (wantDebug) {
                loadBuild(primaryDir, '', false);
            } else {
                fetch('/api/version')
                    .then(function(r) { return r.json(); })
                    .then(function(j) { loadBuild(primaryDir, (j && j.version) ? String(j.version) : '', false); })
                    .catch(function() { loadBuild(primaryDir, '', false); });
            }
        }

        // Pause / step controls
        var paused = false;
        var btnPause = document.getElementById('btn-pause');
        var btnStep = document.getElementById('btn-step');

        function togglePause() {
            if (!Module || !Module._main) return;
            paused = !paused;
            if (paused) {
                Module.pauseMainLoop();
                btnPause.textContent = 'Resume';
                btnPause.classList.add('active');
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            } else {
                Module.resumeMainLoop();
                btnPause.textContent = 'Pause';
                btnPause.classList.remove('active');
                setStatus('Rendering', 'ok');
            }
        }

        function stepFrame() {
            if (!paused || !Module || !Module._main) return;
            Module.resumeMainLoop();
            setTimeout(function() {
                Module.pauseMainLoop();
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            }, 0);
        }

        // Player page with a mouse: double-click the game for fullscreen (the
        // pose panel is inside the same container, so it comes along). Not
        // with the on-screen buttons: they and the portrait deck live on
        // <body>, outside the container, so a fullscreen container hid every
        // one of them (a double tap on a phone did it by accident). There the
        // "Full screen" button (touch_controls.js) makes the whole page
        // fullscreen instead.
        document.getElementById('dc3-canvas').addEventListener('dblclick', function() {
            if (window.dc3TouchControls && window.dc3TouchControls.shown) return;
            var c = document.getElementById('canvas-container');
            if (!DEV && !document.fullscreenElement && c.requestFullscreen) c.requestFullscreen().catch(function() {});
        });

        // Keep the screen on while a player is playing (a camera player does
        // not touch the phone, and it dimmed mid-song). Held on every screen
        // but the idle ones (attract, title), released there and whenever the
        // page is hidden -- the browser drops the lock itself then, so it is
        // asked for again when the page is visible. ?wakelock=0 never asks.
        // window.dc3WakeLock = { held, requests, errors } for phone.mjs.
        (function() {
            var wl = window.dc3WakeLock = { held: false, requests: 0, errors: 0, want: false };
            if (window.dc3Switch(new URLSearchParams(location.search).get('wakelock')) === false) return;
            var sentinel = null, asking = false;
            function sync() {
                var want = wl.want && document.visibilityState === 'visible';
                if (want && !sentinel && !asking && navigator.wakeLock && navigator.wakeLock.request) {
                    asking = true;
                    wl.requests++;
                    navigator.wakeLock.request('screen').then(function(s) {
                        asking = false;
                        sentinel = s;
                        wl.held = true;
                        s.addEventListener('release', function() {
                            if (sentinel === s) { sentinel = null; wl.held = false; }
                        });
                        if (!(wl.want && document.visibilityState === 'visible')) sync();
                    }, function() { asking = false; wl.errors++; });
                } else if (!want && sentinel) {
                    var s = sentinel;
                    sentinel = null;
                    wl.held = false;
                    s.release().catch(function() {});
                }
            }
            document.addEventListener('dc3-screen', function(e) {
                wl.want = !/^(attract|title)_screen$/.test(e.detail.screen);
                sync();
            });
            document.addEventListener('visibilitychange', sync);
        })();

        btnPause.addEventListener('click', togglePause);
        btnStep.addEventListener('click', stepFrame);
        document.addEventListener('keydown', function(e) {
            if (!DEV) return;  // P / . are developer keys
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
            if (e.key === '.' && paused) { e.preventDefault(); stepFrame(); }
        });
        // Canvas sizing. The page never writes canvas.width/height after this:
        // the ENGINE sizes the canvas's buffer (GpuDevice_Web.cpp,
        // GpuDevice::FollowCanvas). The canvas's CSS box is the 16:9 rectangle
        // #canvas-container fits into the window; the page only publishes that
        // box in DEVICE pixels as window.miloCanvasDevicePixels = [w, h].
        //   Enhanced look: the engine makes the buffer that box, fitted to 16:9
        //     and capped in rows (1080; 720 on a phone-class adapter without
        //     texture-compression-bc; ?env=MILO_OUTPUT_MAX_ROWS=<rows> either
        //     way), never under 640x360, at render scale 1. Viewports, UI and
        //     the post chain stay laid out in the virtual 1280x720 and scaled
        //     to the buffer (GpuDevice::LogicalWidth), as on the desktop. It
        //     takes a new box once it has held 250 ms, so a drag or a
        //     fullscreen toggle reconfigures once, not per event.
        //   Retail look: the buffer stays the original's 1280x720 and CSS
        //     stretches it to the box, as before.
        // (Until np-webres the buffer was pinned at 1280x720 for both looks,
        // because RndCam::Select programmed a pixel viewport in the virtual
        // resolution; and ?nativeres=1 made the buffer the CSS box, which
        // corner-pinned the frame. Both are gone.)
        // Observing the content box -- device-pixel-content-box where the
        // browser has it, exact; else the CSS content box times
        // devicePixelRatio -- is immune to the engine's own buffer writes: the
        // CSS size is fixed by #dc3-canvas { width/height: 100% }, so a new
        // buffer size never changes the box (window.dc3CanvasObservations
        // counts the callbacks, for the tests).
        (function() {
            var canvas = document.getElementById('dc3-canvas');
            // The engine's starting size (and Retail's for good).
            canvas.width = 1280;
            canvas.height = 720;
            window.dc3CanvasObservations = 0;
            function publish(w, h) {
                w = Math.round(w); h = Math.round(h);
                if (w <= 0 || h <= 0) return;  // collapsed: the engine keeps its frame
                window.miloCanvasDevicePixels = [w, h];
            }
            function fromRect() {
                var r = canvas.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                publish(r.width * dpr, r.height * dpr);
            }
            fromRect();
            if (typeof ResizeObserver === 'undefined') {
                window.addEventListener('resize', fromRect);
                return;
            }
            var onResize = function(entries) {
                window.dc3CanvasObservations++;
                var e = entries[entries.length - 1];
                var dp = e.devicePixelContentBoxSize && e.devicePixelContentBoxSize[0];
                var cb = e.contentBoxSize && (e.contentBoxSize[0] || e.contentBoxSize);
                var dpr = window.devicePixelRatio || 1;
                if (!cb || cb.inlineSize === undefined) {
                    fromRect();
                    return;
                }
                var cw = cb.inlineSize * dpr, ch = cb.blockSize * dpr;
                // device-pixel-content-box is the CSS box times dpr snapped to
                // whole pixels; take it when it agrees within that snapping.
                // Chromium's device emulation (DevTools, headless tests with a
                // deviceScaleFactor) reports it in CSS pixels while dpr is the
                // emulated one; there the CSS box times dpr is the answer.
                if (dp && Math.abs(dp.inlineSize - cw) <= 2 && Math.abs(dp.blockSize - ch) <= 2)
                    publish(dp.inlineSize, dp.blockSize);
                else
                    publish(cw, ch);
            };
            var ro = new ResizeObserver(onResize);
            try {
                ro.observe(canvas, { box: 'device-pixel-content-box' });
            } catch (err) {
                ro.observe(canvas);  // Safari: no device-pixel-content-box
            }
            // A devicePixelRatio change (browser zoom, a window moved to another
            // monitor) without a CSS change: Safari's content-box observer does
            // not fire for it.
            window.addEventListener('resize', function() {
                var dp = window.miloCanvasDevicePixels, r = canvas.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                if (!dp || Math.abs(dp[0] - r.width * dpr) > 2 || Math.abs(dp[1] - r.height * dpr) > 2) fromRect();
            });
        })();
    </script>
    <!-- Webcam pose input: camera panel + MediaPipe worker -> dc3_pose_push
         (native/web/pose/, docs/native/POSE_INPUT.md). ?pose=off disables. -->
    <script type="module" src="pose/pose_input.js"></script>
    <!-- Portrait layout on a phone held upright (?portrait=0 off, =1 any device). -->
    <script src="portrait.js"></script>
    <!-- On-screen buttons on touch-only devices (?touch=1 forces, ?touch=0 hides). -->
    <script src="touch_controls.js"></script>
</body>
</html>
