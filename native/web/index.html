<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC3 — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ccc;
        }
        #canvas-container {
            position: relative;
            /* Height-first: fill 80% of viewport height, derive width from 16:9 */
            height: 80vh;
            width: min(100vw, calc(80vh * 16 / 9));
            max-width: 100vw;
        }
        #dc3-canvas {
            outline: 1px solid #333;
            width: 100%;
            height: 100%;
            display: block;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }
        #status.error { color: #e55; }
        #status.ok { color: #5e5; }
        #status.loading { color: #5ae; }
        #controls {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #controls span {
            color: #888;
            background: #1a1a1a;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        #toolbar {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        #toolbar button {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 14px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        #toolbar button:hover { background: #2a2a2a; border-color: #555; }
        #toolbar button.active { color: #f90; border-color: #f90; }
        #console {
            margin-top: 8px;
            max-width: 1280px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        #console .err { color: #c66; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="dc3-canvas" width="1280" height="720" tabindex="0"></canvas>
        <video id="splash-video" playsinline muted preload="auto"
               style="position:absolute;top:0;left:0;width:100%;height:100%;
                      object-fit:contain;z-index:2147483647;background:#000;
                      pointer-events:none;transform:translateZ(0);"></video>
    </div>
    <div id="status">Initializing...</div>
    <div id="controls">
        <span>Arrows/WASD</span> navigate &nbsp;
        <span>Enter</span> confirm &nbsp;
        <span>Esc</span> back &nbsp;
        <span>Space</span> start &nbsp;
        <span>Tab</span> select &nbsp;
        <span>Q/E</span> LB/RB &nbsp;
        <span>Gamepad</span> auto-detected
    </div>
    <div id="toolbar">
        <button id="btn-pause" title="Pause/resume engine loop (P)">Pause</button>
        <button id="btn-step" title="Advance one frame while paused (.)">Step</button>
    </div>
    <div id="console"></div>

    <script>
        const status = document.getElementById('status');
        const logDiv = document.getElementById('console');

        function log(text, isErr) {
            const line = document.createElement('div');
            line.textContent = text;
            if (isErr) line.className = 'err';
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Hard stop if WebGPU isn't available — without it the canvas is just
        // black after the splash, and we'd otherwise download 12MB of assets
        // before that's obvious. Show the user how to enable it instead.
        if (!navigator.gpu) {
            const ua = navigator.userAgent;
            const isFirefox = /Firefox/.test(ua);
            const isChromium = /Chrom(e|ium)/.test(ua);
            const browserHelp = isFirefox
                ? 'Firefox: WebGPU requires Nightly with <code>dom.webgpu.enabled=true</code> in <code>about:config</code>.'
                : isChromium
                ? 'Chrome/Chromium on Linux: launch with <code>--enable-unsafe-webgpu --enable-features=Vulkan</code>, or toggle <code>chrome://flags/#enable-unsafe-webgpu</code>.'
                : 'Use a Chromium-based browser with WebGPU enabled, or Firefox Nightly with <code>dom.webgpu.enabled</code>.';
            status.innerHTML =
                '<strong>WebGPU not available in this browser.</strong><br>' +
                '<span style="color:#aaa">DC3 needs WebGPU to render. ' + browserHelp + '</span>';
            status.className = 'error';
            status.style.maxWidth = '900px';
            status.style.textAlign = 'center';
            log('WebGPU not available — refusing to boot engine (would render black)', true);
            // Hide the splash overlay so the error is visible.
            const sv = document.getElementById('splash-video');
            if (sv) sv.remove();
            // Stop here — don't load the WASM module.
            throw new Error('WebGPU unavailable');
        }
        {
            status.textContent = 'Loading WASM...';
            status.className = 'loading';

            var wasmReady = false;
            var Module = {
                canvas: document.getElementById('dc3-canvas'),
                onRuntimeInitialized: function() {
                    wasmReady = true;
                    console.log('RUNTIME_INIT_OK');
                    status.textContent = 'Downloading assets...';
                    status.className = 'loading';
                },
                print: function(text) {
                    console.log(text);
                    log(text);
                    // Update status based on engine output
                    if (text.includes('downloads complete')) {
                        status.textContent = 'Assets loaded, initializing GPU...';
                        status.className = 'loading';
                    }
                    if (text.includes('GPU ready')) {
                        status.textContent = 'Rendering';
                        status.className = 'ok';
                    }
                    if (text.includes('GPU init failed')) {
                        status.textContent = 'GPU not available (headless mode)';
                        status.className = 'error';
                    }
                },
                printErr: function(text) {
                    console.error(text);
                    log(text, true);
                    // Adapter/device failures from the WebGPU layer arrive on stderr.
                    // Surface them in the status bar so the user knows why nothing renders.
                    if (text.includes('adapter request failed') ||
                        text.includes('device request failed') ||
                        text.includes('device lost')) {
                        status.textContent = 'GPU error — see console';
                        status.className = 'error';
                        var sv = document.getElementById('splash-video');
                        if (sv) sv.remove();
                    }
                }
            };

            // --- Splash video overlay ---
            // Plays flimflam.webm over the canvas while WASM boots.
            // Purely cosmetic — the engine skips its own splash on web.
            var splashVid = document.getElementById('splash-video');
            splashVid.src = '/api/file/ui/splash/flimflam.webm';
            splashVid.play().catch(function() {});
            function dismissSplash() {
                if (!splashVid) return;
                splashVid.style.transition = 'opacity 0.4s ease-out';
                splashVid.style.opacity = '0';
                setTimeout(function() {
                    splashVid.remove();
                    splashVid = null;
                }, 500);
            }
            splashVid.addEventListener('ended', dismissSplash);
            // Unmute on first interaction (autoplay requires muted)
            function splashUnmute() {
                if (splashVid) splashVid.muted = false;
                document.removeEventListener('keydown', splashUnmute);
                document.removeEventListener('click', splashUnmute);
            }
            document.addEventListener('keydown', splashUnmute);
            document.addEventListener('click', splashUnmute);
            // Skip on Space/Enter/Escape
            function splashSkip(e) {
                if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter' && e.key !== 'Escape') return;
                dismissSplash();
            }
            document.addEventListener('keydown', splashSkip);
            document.addEventListener('click', splashSkip);
            // Safety: dismiss after 20s even if video stalls
            setTimeout(function() { if (splashVid) dismissSplash(); }, 20000);

            // ── Build selection: release (default, cached) vs debug ──────────
            // build.sh deploys two variants into sibling subdirs:
            //   release/ — debug-info stripped + brotli/gzip, served immutable
            //   debug/   — full -g2 wasm, served no-store (fast iteration)
            // ?debug=true (or ?debug=1) loads debug and bypasses the HTTP cache;
            // anything else loads release. Release URLs are version-stamped with
            // ?v=<token> from /api/version so a rebuilt release wasm busts the
            // immutable cache (the server keys caching off the /release/ path,
            // ignoring the query). Falls back to the other variant if one isn't
            // deployed. No pre-js here, so Module.locateFile is what redirects
            // emscripten's wasm fetch into the chosen subdir.
            var dbgParam = new URLSearchParams(location.search).get('debug');
            var wantDebug = dbgParam !== null &&
                            dbgParam !== '0' && dbgParam !== 'false' && dbgParam !== 'off';

            function loadBuild(dir, version, isFallback) {
                var q = (dir === 'release/' && version) ? ('?v=' + encodeURIComponent(version)) : '';
                var wasmUrl = dir + 'dc3-web.wasm' + q;
                Module.locateFile = function(path) { return dir + path + q; };
                // Explicit streaming instantiation (mirrors RB3's rb3_pre.js) of
                // the version-stamped wasm URL, so a reload of the immutable
                // release build reuses the cached + already-compiled wasm instead
                // of re-downloading it (verified fromDiskCache on reload with a
                // persistent browser profile). Imports pass through unchanged —
                // emscripten's abort-stubs for --allow-undefined imports stay
                // intact (DC3 instantiates fine without patching).
                Module.instantiateWasm = function(imports, successCallback) {
                    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
                    function viaArrayBuffer() {
                        return fetch(wasmUrl)
                            .then(function(r) { return r.arrayBuffer(); })
                            .then(function(bytes) { return WebAssembly.instantiate(bytes, imports); })
                            .then(function(res) { successCallback(res.instance, res.module); });
                    }
                    if (typeof WebAssembly.instantiateStreaming === 'function') {
                        return WebAssembly.instantiateStreaming(fetch(wasmUrl), imports)
                            .then(function(res) {
                                console.log('[dc3] wasm instantiateStreaming ' + ((performance.now() - t0) | 0) + 'ms');
                                successCallback(res.instance, res.module);
                            })
                            .catch(function(err) {
                                console.warn('[dc3] instantiateStreaming failed (' + err + '); arrayBuffer fallback');
                                return viaArrayBuffer();
                            });
                    }
                    return viaArrayBuffer().catch(function(err) { console.error('[dc3] instantiateWasm failed: ' + err); });
                };
                console.log('LOADING_WASM_JS (' + dir + (q || '') + ')');
                var script = document.createElement('script');
                script.src = dir + 'dc3-web.js' + q;
                script.onload = function() { console.log('WASM_JS_LOADED (' + dir + ')'); };
                script.onerror = function(e) {
                    if (!isFallback) {
                        var other = (dir === 'release/') ? 'debug/' : 'release/';
                        console.warn('[dc3] ' + dir + ' build not deployed — falling back to ' + other);
                        loadBuild(other, version, true);
                        return;
                    }
                    console.error('WASM_JS_ERROR: ' + e);
                    status.textContent = 'No build deployed — run native/web/build.sh';
                    status.className = 'error';
                };
                document.body.appendChild(script);
            }

            var primaryDir = wantDebug ? 'debug/' : 'release/';
            if (wantDebug) {
                loadBuild(primaryDir, '', false);
            } else {
                fetch('/api/version')
                    .then(function(r) { return r.json(); })
                    .then(function(j) { loadBuild(primaryDir, (j && j.version) ? String(j.version) : '', false); })
                    .catch(function() { loadBuild(primaryDir, '', false); });
            }
        }

        // Pause / step controls
        var paused = false;
        var btnPause = document.getElementById('btn-pause');
        var btnStep = document.getElementById('btn-step');

        function togglePause() {
            if (!Module || !Module._main) return;
            paused = !paused;
            if (paused) {
                Module.pauseMainLoop();
                btnPause.textContent = 'Resume';
                btnPause.classList.add('active');
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            } else {
                Module.resumeMainLoop();
                btnPause.textContent = 'Pause';
                btnPause.classList.remove('active');
                status.textContent = 'Rendering';
                status.className = 'ok';
            }
        }

        function stepFrame() {
            if (!paused || !Module || !Module._main) return;
            Module.resumeMainLoop();
            setTimeout(function() {
                Module.pauseMainLoop();
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            }, 0);
        }

        btnPause.addEventListener('click', togglePause);
        btnStep.addEventListener('click', stepFrame);
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
            if (e.key === '.' && paused) { e.preventDefault(); stepFrame(); }
        });
        // Canvas resize — match canvas resolution to display size
        (function() {
            var canvas = document.getElementById('dc3-canvas');
            var pending = false;
            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                // Use CSS pixels, not device pixels — the engine's Rnd
                // dimensions stay at 1280x720 so scaling by DPR creates
                // a surface larger than the viewport (black bars).
                var w = Math.round(rect.width);
                var h = Math.round(rect.height);
                if (w <= 0 || h <= 0) return;
                if (canvas.width === w && canvas.height === h) return;
                canvas.width = w;
                canvas.height = h;
                if (wasmReady && Module._dc3_resize_canvas) {
                    Module._dc3_resize_canvas(w, h);
                }
            }
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function() {
                    if (!pending) {
                        pending = true;
                        requestAnimationFrame(function() {
                            pending = false;
                            resizeCanvas();
                        });
                    }
                }).observe(canvas);
            }
            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
</body>
</html>
