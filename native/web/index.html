<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC3 — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ccc;
        }
        #dc3-canvas {
            border: 1px solid #333;
            max-width: 100vw;
            max-height: 80vh;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #888;
        }
        #status.error { color: #e55; }
        #status.ok { color: #5e5; }
        #status.loading { color: #5ae; }
        #controls {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }
        #controls span {
            color: #888;
            background: #1a1a1a;
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        #toolbar {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        #toolbar button {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 4px 14px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        #toolbar button:hover { background: #2a2a2a; border-color: #555; }
        #toolbar button.active { color: #f90; border-color: #f90; }
        #console {
            margin-top: 8px;
            max-width: 1280px;
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #666;
            background: #111;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        #console .err { color: #c66; }
    </style>
</head>
<body>
    <canvas id="dc3-canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="status">Initializing...</div>
    <div id="controls">
        <span>Arrows/WASD</span> navigate &nbsp;
        <span>Enter</span> confirm &nbsp;
        <span>Esc</span> back &nbsp;
        <span>Space</span> start &nbsp;
        <span>Tab</span> select &nbsp;
        <span>Q/E</span> LB/RB
    </div>
    <div id="toolbar">
        <button id="btn-pause" title="Pause/resume engine loop (P)">Pause</button>
        <button id="btn-step" title="Advance one frame while paused (.)">Step</button>
    </div>
    <div id="console"></div>

    <script>
        const status = document.getElementById('status');
        const logDiv = document.getElementById('console');

        function log(text, isErr) {
            const line = document.createElement('div');
            line.textContent = text;
            if (isErr) line.className = 'err';
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        if (!navigator.gpu) {
            log('WebGPU not available — engine will run without rendering', true);
        }
        {
            status.textContent = 'Loading WASM...';
            status.className = 'loading';

            var Module = {
                canvas: document.getElementById('dc3-canvas'),
                onAbort: function(what) {
                    console.error('WASM ABORT:', what);
                    console.error('Stack:', new Error().stack);
                },
                onRuntimeInitialized: function() {
                    console.log('RUNTIME_INIT_OK');
                    status.textContent = 'Downloading assets...';
                    status.className = 'loading';
                },
                print: function(text) {
                    console.log(text);
                    log(text);
                    // Update status based on engine output
                    if (text.includes('downloads complete')) {
                        status.textContent = 'Assets loaded, initializing GPU...';
                        status.className = 'loading';
                    }
                    if (text.includes('GPU ready')) {
                        status.textContent = 'Rendering';
                        status.className = 'ok';
                    }
                    if (text.includes('GPU init failed')) {
                        status.textContent = 'GPU not available (headless mode)';
                        status.className = 'error';
                    }
                },
                printErr: function(text) {
                    console.error(text);
                    log(text, true);
                }
            };

            console.log('LOADING_WASM_JS');
            var script = document.createElement('script');
            script.src = 'dc3-web.js';
            script.onload = function() {
                console.log('WASM_JS_LOADED');
            };
            script.onerror = function(e) {
                console.error('WASM_JS_ERROR: ' + e);
                status.textContent = 'Failed to load dc3-web.js — build first (native/web/build.sh)';
                status.className = 'error';
            };
            document.body.appendChild(script);
        }

        // Pause / step controls
        var paused = false;
        var btnPause = document.getElementById('btn-pause');
        var btnStep = document.getElementById('btn-step');

        function togglePause() {
            if (!Module || !Module._main) return;
            paused = !paused;
            if (paused) {
                Module.pauseMainLoop();
                btnPause.textContent = 'Resume';
                btnPause.classList.add('active');
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            } else {
                Module.resumeMainLoop();
                btnPause.textContent = 'Pause';
                btnPause.classList.remove('active');
                status.textContent = 'Rendering';
                status.className = 'ok';
            }
        }

        function stepFrame() {
            if (!paused || !Module || !Module._main) return;
            Module.resumeMainLoop();
            setTimeout(function() {
                Module.pauseMainLoop();
                status.textContent = 'Paused (frame ' + (window.dc3FrameCount || '?') + ')';
            }, 0);
        }

        btnPause.addEventListener('click', togglePause);
        btnStep.addEventListener('click', stepFrame);
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
            if (e.key === '.' && paused) { e.preventDefault(); stepFrame(); }
        });
    </script>
</body>
</html>
