# =============================================================================
# dc3-decomp — Phase 0.4 native CI smoke
#
# Builds the native LP64 clang port of dc3 (dc3-decomp/native/CMakeLists.txt)
# on ubuntu-latest:
#   - dc3-native       : main executable
#   - milo-viewer      : standalone .milo viewer
#   - render-test      : programmatic render checker
#   - milo-tests       : the 371-test GTest suite (the gate)
#
# Scope: this is the NATIVE pipeline (Phase 0 of the RB3 native port — see
#        rb3/docs/native/NATIVE_PORT_ROADMAP.md §0.4). The matched-fork MSVC-PPC
#        ninja build (.github/workflows/build.yml) is a SEPARATE pipeline that
#        gates the asm-match decomp (Memory_Xbox.cpp etc.) and is out of scope.
#
# Sibling repos required:
#   ../milo-native-engine    — shared LP64 engine; dc3-decomp/native/CMakeLists.txt
#                              consumes it via add_subdirectory(MILO_ENGINE_PATH).
#                              TODO: milo-native-engine has no public GitHub repo
#                              yet — see the workflow header in
#                              milo-native-engine/.github/workflows/engine-tests.yml
#                              for the auth story. We checkout from
#                              ${{ vars.MILO_ENGINE_REPO }} when defined.
#
# Assets: milo-tests needs DC3_DATA (orig-assets/, ~18 GB uncompressed) for the
# majority of cases. The compressed assets in dc3-decomp-deps/orig-assets.tar.xz
# are ~6 GB and don't fit a free GitHub-hosted runner either. Asset-dependent
# tests GTEST_SKIP() cleanly when DC3_DATA is unset (see
# milo-native-engine/tests/CMakeLists.txt for the env-var contract that the
# dc3 native tests share). The full 371-test gate is a separate manual /
# self-hosted-runner / release-asset check.
# =============================================================================

name: native-build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DAWN_RELEASE_TAG: v20260423.175430
  DAWN_RELEASE_ASSET: Dawn-31e25af254ab572c77054edec4946d2244e184dd-ubuntu-latest-Release.tar.gz
  DAWN_TREE_NAME: Dawn-31e25af254ab572c77054edec4946d2244e184dd-ubuntu-latest-Release

jobs:
  dc3-native:
    name: dc3-native + milo-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout dc3-decomp
        uses: actions/checkout@v4
        with:
          path: dc3-decomp
          fetch-depth: 1

      - name: Checkout milo-native-engine sibling
        # milo-native-engine has no public repo yet (Phase 0.1 only landed
        # locally). Until it's pushed, this step is allowed to fail and the
        # next step synthesizes a placeholder. Once published, set repository
        # variables MILO_ENGINE_REPO (e.g. freeqaz/milo-native-engine) and
        # MILO_ENGINE_REF (default 'main') to wire it up.
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MILO_ENGINE_REPO || github.repository_owner }}/milo-native-engine
          ref: ${{ vars.MILO_ENGINE_REF || 'main' }}
          path: milo-native-engine
        continue-on-error: true

      - name: Fallback - synthesize milo-native-engine placeholder
        run: |
          set -e
          if [ ! -f milo-native-engine/CMakeLists.txt ]; then
            echo "::warning::milo-native-engine sibling not available — dc3-native CMake will fail because dc3 requires the real engine (Dawn/gfx/audio) targets. TODO: publish milo-native-engine and set vars.MILO_ENGINE_REPO."
            mkdir -p milo-native-engine
            cat > milo-native-engine/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(milo-engine LANGUAGES C CXX)
          # Placeholder — dc3-native consumes MILO_ENGINE_DECOMP_* context so the
          # real engine is needed; this only exists so the CMake-configure step
          # produces a clear diagnostic instead of a 'directory not found' error.
          message(FATAL_ERROR "milo-native-engine sibling repo is not published yet — see .github/workflows/native-build.yml")
          CMAKE
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libglfw3-dev \
            libgtest-dev \
            libgmock-dev \
            libcurl4-openssl-dev \
            libjpeg-dev \
            libvorbis-dev \
            libogg-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev
          clang --version
          cmake --version

      - name: Cache Dawn prebuilt
        id: dawn-cache
        uses: actions/cache@v4
        with:
          path: dc3-decomp-deps/dawn
          key: dawn-${{ env.DAWN_RELEASE_TAG }}-ubuntu-latest

      - name: Download + unpack Dawn prebuilt
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p dc3-decomp-deps/dawn
          curl -fSL -o /tmp/dawn.tar.gz \
            "https://github.com/google/dawn/releases/download/${DAWN_RELEASE_TAG}/${DAWN_RELEASE_ASSET}"
          mkdir -p /tmp/dawn-unpacked
          tar -xzf /tmp/dawn.tar.gz -C /tmp/dawn-unpacked
          cp -R /tmp/dawn-unpacked/"${DAWN_TREE_NAME}"/. dc3-decomp-deps/dawn/
          ls dc3-decomp-deps/dawn

      - name: Symlink Dawn lib64 -> lib (sibling-layout compat)
        run: |
          set -e
          cd dc3-decomp-deps/dawn
          if [ -d lib64 ] && [ ! -e lib ]; then
            ln -s lib64 lib
          fi
          ls -la
          ls lib/cmake/Dawn

      - name: Sanity check — sibling layout
        run: |
          ls -d dc3-decomp
          ls -d milo-native-engine
          ls -d dc3-decomp-deps/dawn
          test -f dc3-decomp/native/CMakeLists.txt
          test -f dc3-decomp-deps/dawn/lib/cmake/Dawn/DawnConfig.cmake

      - name: Configure dc3-native
        working-directory: dc3-decomp/native
        run: |
          # CMAKE_PREFIX_PATH lets find_package(Dawn) locate the prebuilt at the
          # sibling path; dc3 CMake also hardcodes that layout (see
          # dc3-decomp/native/CMakeLists.txt around find_package(Dawn REQUIRED)).
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/dc3-decomp-deps/dawn" \
            -DMILO_ENGINE_PATH="${GITHUB_WORKSPACE}/milo-native-engine"

      - name: Build native targets
        working-directory: dc3-decomp/native
        run: |
          cmake --build build \
            --target dc3-native milo-viewer render-test milo-tests \
            -j"$(nproc)" --verbose

      - name: Verify binaries
        working-directory: dc3-decomp/native
        run: |
          ls -la build/dc3-native build/milo-viewer build/render-test build/milo-tests
          file build/dc3-native build/milo-viewer build/render-test build/milo-tests

      - name: Run ctest (milo-tests 371-suite)
        working-directory: dc3-decomp/native/build
        run: |
          # -j1: see milo-native-engine/tests/CMakeLists.txt RESOURCE_LOCK note;
          # Dawn/WebGPU + audio init contend at the process level.
          # Asset-dependent tests GTEST_SKIP() when DC3_DATA is unset; we don't
          # set DC3_DATA here because the ~18 GB extracted assets aren't in CI.
          # The full asset-aware gate is a separate manual/release check.
          # `cmd || echo ...` is a compound whose exit status is ECHO'S, so this
          # step exits 0 no matter what ctest did -- verified locally under
          # `bash -e`, which is how Actions runs a `run:` block. The `|| echo`
          # is kept deliberately (the summary and log-upload steps below must
          # still run on failure) and the job is now failed by the explicit
          # "Gate on test results" step at the end. Nothing used to read
          # CTEST_FAILED except the artifact upload.
          #
          # --no-tests=error, not =ignore: with =ignore, a CMake edit that stops
          # registering milo-tests produces zero tests and a green job, which is
          # indistinguishable from a passing suite.
          ctest -j1 --output-on-failure --no-tests=error || echo "CTEST_FAILED=1" >> "$GITHUB_ENV"

      - name: Compute test summary
        if: always()
        working-directory: dc3-decomp/native/build
        run: |
          LOG="Testing/Temporary/LastTest.log"
          if [ -f "$LOG" ]; then
            PASSED=$(grep -cE '^\[       OK \]' "$LOG" || true)
            FAILED=$(grep -cE '^\[  FAILED  \]' "$LOG" || true)
            SKIPPED=$(grep -cE '^\[  SKIPPED \]' "$LOG" || true)
            # gtest's own marker, anchored. A bare `grep -cE 'DISABLED'` counted
            # every line containing the substring anywhere -- test names, prose
            # like "You have 1 DISABLED test" -- so the number was not a count
            # of anything. Verified: a 5-line synthetic log with ONE disabled
            # test scored 2.
            DISABLED=$(grep -cE '^\[ DISABLED \]' "$LOG" || true)
            echo "TEST_PASSED=$PASSED" >> "$GITHUB_ENV"
            echo "TEST_FAILED=$FAILED" >> "$GITHUB_ENV"
            echo "TEST_SKIPPED=$SKIPPED" >> "$GITHUB_ENV"
            echo "TEST_DISABLED=$DISABLED" >> "$GITHUB_ENV"
            echo "TEST_LOG_READ=1" >> "$GITHUB_ENV"
          else
            # No `else` used to exist, so the four TEST_* vars stayed unset and
            # the summary table rendered `?` in rows that otherwise read as
            # measurements. "could not measure" must not be spelled the same as
            # a number.
            echo "::error::$LOG is absent -- no test results were produced."
            echo "TEST_LOG_READ=0" >> "$GITHUB_ENV"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## dc3-decomp native CI summary"
            echo ""
            echo "**Targets built:** dc3-native, milo-viewer, render-test, milo-tests"
            echo "**Engine pin source:** \`${{ vars.MILO_ENGINE_REPO || 'github.repository_owner' }}/milo-native-engine@${{ vars.MILO_ENGINE_REF || 'main' }}\`"
            echo "**Dawn:** ${DAWN_RELEASE_TAG}"
            echo ""
            echo "### milo-tests results"
            echo "| metric | count |"
            echo "|--------|-------|"
            echo "| GTest cases PASSED   | ${TEST_PASSED:-?} |"
            echo "| GTest cases FAILED   | ${TEST_FAILED:-?} |"
            echo "| GTest cases SKIPPED  | ${TEST_SKIPPED:-?} (asset-dependent tests skip when DC3_DATA is unset) |"
            echo "| GTest cases DISABLED | ${TEST_DISABLED:-?} |"
            echo ""
            if [ "${CTEST_FAILED:-0}" = "1" ]; then
              echo ":warning: ctest reported failures; see logs."
            fi
            echo ""
            echo "Roadmap: \`rb3/docs/native/NATIVE_PORT_ROADMAP.md\` §0.4."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE. Until this step existed, a failing ctest produced a green job
      # whose only trace was ":warning: ctest reported failures" inside the
      # markdown summary, and `if: failure()` on the upload step below never
      # fired because no step had failed. Adding `EXPECT_EQ(1, 2)` to any test
      # left the PR mergeable.
      #
      # It runs `if: always()` so it also catches the case where the test step
      # was skipped or the log never appeared.
      - name: Gate on test results
        if: always()
        run: |
          rc=0
          if [ "${TEST_LOG_READ:-0}" != "1" ]; then
            echo "FAIL: no LastTest.log -- ctest produced no results at all."
            rc=1
          fi
          if [ "${CTEST_FAILED:-0}" = "1" ]; then
            echo "FAIL: ctest exited non-zero."
            rc=1
          fi
          if [ "${TEST_FAILED:-0}" != "0" ]; then
            echo "FAIL: ${TEST_FAILED} GTest case(s) failed."
            rc=1
          fi
          # A green run over zero executed cases is the "empty universe reads as
          # clean" shape; --no-tests=error covers ctest-level registration, this
          # covers a suite that registered but ran nothing.
          if [ "${TEST_LOG_READ:-0}" = "1" ] \
             && [ "${TEST_PASSED:-0}" = "0" ] && [ "${TEST_FAILED:-0}" = "0" ]; then
            echo "FAIL: zero GTest cases passed AND zero failed -- nothing ran."
            rc=1
          fi
          if [ "$rc" = "0" ]; then
            echo "OK: ${TEST_PASSED:-?} passed, ${TEST_FAILED:-?} failed, ${TEST_SKIPPED:-?} skipped."
          fi
          exit "$rc"

      - name: Upload logs on failure
        if: failure() || env.CTEST_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: dc3-native-logs
          path: |
            dc3-decomp/native/build/Testing/Temporary/LastTest.log
            dc3-decomp/native/build/Testing/Temporary/LastTestsFailed.log
            dc3-decomp/native/build/CMakeFiles/CMakeOutput.log
            dc3-decomp/native/build/CMakeFiles/CMakeError.log
            dc3-decomp/native/build/CMakeCache.txt
            dc3-decomp/native/build/.ninja_log
          if-no-files-found: ignore
          retention-days: 7
